name: Check Site

# Garde-fous de cohérence, lancés uniquement quand les fichiers concernés changent :
#  - blocs partagés des pages (en-tête, pied de page, <head>) à jour avec src/partials
#  - js/tarifs-data.js à jour avec la grille de tarifs.html
# En cas d'échec : python3 scripts/build.py && python3 scripts/sync_tarifs.py, puis commiter.
on:
  push:
    paths:
      - '*.html'
      - 'src/**'
      - 'js/tarifs-data.js'
      - 'scripts/build.py'
      - 'scripts/sync_tarifs.py'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build.py --check
      - run: python scripts/sync_tarifs.py --check
