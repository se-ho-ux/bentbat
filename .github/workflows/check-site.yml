name: Check Site

# Garde-fous de cohérence, lancés uniquement quand les fichiers concernés changent :
#  - js/tarifs-data.js à jour avec la grille de tarifs.html
#  - pages de services à jour avec content/services/*.json
#  - blocs partagés (en-tête, pied de page, <head>) à jour avec src/partials
#  - sitemap.xml à jour, puis audit SEO/technique (scripts/qa.py : erreurs bloquantes)
# En cas d'échec : python3 scripts/sync_tarifs.py && python3 scripts/build_services.py && python3 scripts/build_sitemap.py, puis commiter.
on:
  push:
    paths:
      - '*.html'
      - 'src/**'
      - 'content/**'
      - 'sitemap.xml'
      - 'js/tarifs-data.js'
      - 'scripts/*.py'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/sync_tarifs.py --check
      - run: python scripts/build_services.py --check
      - run: python scripts/build.py --check
      - run: python scripts/build_sitemap.py --check
      - run: python scripts/qa.py
