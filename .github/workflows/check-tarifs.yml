name: Check Tarifs

# Vérifie que js/tarifs-data.js (estimateur du formulaire de devis) correspond
# à la grille de tarifs.html. Ne se lance que si l'un des fichiers concernés change.
# En cas d'échec : python3 scripts/sync_tarifs.py, puis commiter js/tarifs-data.js.
on:
  push:
    paths:
      - 'tarifs.html'
      - 'js/tarifs-data.js'
      - 'scripts/sync_tarifs.py'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/sync_tarifs.py --check
