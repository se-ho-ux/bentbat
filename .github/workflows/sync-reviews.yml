name: Sync Google Reviews

# Quotidien. Sans le secret GOOGLE_PLACES_API_KEY, le script s'arrête sans
# erreur (avertissement dans le journal) et reviews.json reste inchangé.
# Secrets : GOOGLE_PLACES_API_KEY (obligatoire), GOOGLE_PLACE_ID (conseillé).
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch reviews
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          GOOGLE_PLACE_ID: ${{ secrets.GOOGLE_PLACE_ID }}
        run: python scripts/fetch_reviews.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reviews.json
          git diff --cached --quiet || git commit -m "chore: sync Google reviews"
          git push
